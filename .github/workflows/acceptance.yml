name: acceptance
on: [push, pull_request, workflow_dispatch]
jobs:
  matrix:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: release-check（版本号残留机械闸·动态版本）
        run: |
          V=$(python cli/wenqu --version | awk '{print $2}' | sed 's/^0\.3\.0-//;s/-maccc$//')
          DV=$(ls docs/*v*.md | sed 's/.*v/v/' | sed 's/\.md//' | head -1)
          echo "Checking: v$DV $V"
          bash tests/release-check.sh v$DV $V
      - name: acceptance
        run: bash tests/acceptance.sh
      - name: pytest 契约
        run: pip install pytest && python -m pytest cli/test_wenqu.py -q
      - name: Runner Linux /proc token 扫杀真腿（ubuntu 实测；macos 结构腿+SKIP）
        # 八轮遗留项「Runner Linux /proc 通路未实测」：ubuntu-latest 上真跑
        # system/tests/test_linux_proc_path.py 的两条真腿（/proc environ token
        # 扫描命中+收敛、TrustedRunner 超时击杀 setsid+double-fork 逃逸 daemon）；
        # macos-latest 上同文件跑结构腿（monkeypatch /proc 布局）+真腿 SKIP 标注。
        run: python -m pytest system/tests/test_linux_proc_path.py -v
      - name: selftest
        run: python cli/wenqu selftest
      # ---- G9-08（八轮 1.4-10）：required CI 全量检查面 ------------------
      - name: 仓根 pytest 全量（含全部 system/tests；worktree .git 兼容）
        run: pip install pytest && python -m pytest -q
      - name: 严格 evidence validator（active 全字段+实算 hash+TTL）
        run: python tools/evidence_validator.py --root .
      - name: 全模块自测（bugscan/station2-7/capacity 八模块 SELF-TEST）
        run: |
          for m in bugscan_orchestrator station2_static station3_contract \
                   station4_behavior station5_live_fire station6_adversarial \
                   station7_runtime capacity_monitor; do
            PYTHONPATH=system python3 -m "wenqu_core.$m"
          done
      - name: 追踪矩阵（§20/§25.1 目录+方案 hash 一致性）
        run: PYTHONPATH=system python tools/ac_traceability.py --check
      - name: TLA 双配置 TLC 完成级（G9-03：七段全序 A + retry/CAS/nonce B）
        # 完成级判据：输出含 "Model checking completed"；非零违例/截断=红。
        run: |
          pushd specs/tla >/dev/null
          for cfg in wenqu_pipeline_A wenqu_pipeline_B; do
            java -cp ../../system/bin/tla2tools.jar tlc2.TLC -config "$cfg.cfg" wenqu_pipeline 2>&1 | tee "/tmp/tlc-$cfg.log"
            grep -q "Model checking completed. No error has been found." "/tmp/tlc-$cfg.log"
          done
          popd >/dev/null
      # P1f2 mutation 真主门（G9-07）：已内嵌于 acceptance.sh 的 P1f2 节
      # （required CI 的 acceptance 步即跑 18 冻结集·逐作用点计分 score
      # 100% 门——R9-INFRA-MUT-GRANULARITY-002 根修）——此处不再独立
      # 重跑，避免 macOS 时长翻倍。

  # ---- W11-11（十轮 W2 扣分「受限容器腿缺」根治）：真实受限容器 required job ----
  # 在「固定 digest 镜像 + 非 root + 只读 rootfs + 仓库只读挂载 + /tmp 独立
  # tmpfs + network none + cap-drop ALL + no-new-privileges + pids/memory/cpu
  # 限额 + 禁 Docker socket + 禁 pyc」的真容器里实测：
  #   1) restricted_container_probe.py：全套隔离不变量（euid 非 0、rootfs/源码树
  #      写拒、CapEff=0、NoNewPrivs=1、网络/Docker socket 不可达、cgroup 限额
  #      可读且真实生效——pids fork 饱和、memory OOM 击杀、CPU 节流实测）；
  #   2) W2 真腿容器内全部运行且零 SKIP：test_linux_proc_path.py（/proc environ
  #      token 扫杀+收敛、TrustedRunner 超时击杀 setsid+double-fork 逃逸 daemon）、
  #      test_runner_daemon.py（环境剥离/超时/孙进程终止）、test_infra_hardening.py
  #      （CAS 负例：symlink swap/hardlink 预置/半写毒文件/SIGKILL 中断恢复）。
  # 退出码合同：0=全过；1=限制可绕过；2=参数错；3=Docker//proc/cgroup 测量面
  # 不可验证（缺环境绝不 SKIP）；外层 GNU timeout 到期=124。job 按退出码直接红。
  restricted-container:
    name: restricted-container   # W11-12 exact required check context 同名
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 真实受限容器（固定 digest+全套隔离+W2 真腿）
        env:
          # 固定 digest：python:3.11-bookworm 多架构 index（amd64=CI/arm64=本机
          # 预验同 digest）。含 ps/timeout/bash/tar（探针与真腿依赖）。
          WQ_IMAGE: python:3.11-bookworm@sha256:5887f265d8d44d8b4734d3658b21d668edf5aaf92e4945bc0c984afbfab105d3
          WQ_UID: "65532"
          WQ_GID: "65532"
          WQ_PIDS_LIMIT: "128"
          WQ_MEMORY: 768m
          WQ_MEMORY_BYTES: "805306368"   # 768m 字节数（探针合同校验 memory.max）
          WQ_CPUS: "1.5"
          WQ_CPU_QUOTA: "150000"         # cpu.max quota(us)（1.5 CPU）
          WQ_CPU_PERIOD: "100000"        # cpu.max period(us)
        run: |
          set -euo pipefail
          echo "commit_sha=${GITHUB_SHA} image=${WQ_IMAGE}"
          docker pull "$WQ_IMAGE"
          docker image inspect "$WQ_IMAGE" --format 'pinned-digest={{index .RepoDigests 0}}'
          CTR=wq-restricted-container
          trap 'docker rm -f "$CTR" >/dev/null 2>&1 || true' EXIT
          timeout 900 docker run --rm --name "$CTR" \
            --user "${WQ_UID}:${WQ_GID}" \
            --read-only \
            --network none \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit "$WQ_PIDS_LIMIT" \
            --memory "$WQ_MEMORY" --memory-swap "$WQ_MEMORY" \
            --cpus "$WQ_CPUS" \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=512m,mode=1777 \
            -v "${GITHUB_WORKSPACE}:/wq:ro" \
            -e PYTHONDONTWRITEBYTECODE=1 -e HOME=/tmp -e TMPDIR=/tmp \
            -e WQ_REPO_ROOT=/wq -e WQ_UID -e WQ_GID \
            -e WQ_PIDS_LIMIT -e WQ_MEMORY_BYTES \
            -e WQ_CPU_QUOTA -e WQ_CPU_PERIOD \
            -e WQ_COMMIT_SHA="${GITHUB_SHA}" \
            "$WQ_IMAGE" \
            python3 /wq/system/tests/restricted_container_probe.py


  # ---- W11-14（十轮 W8「真实浏览器 UI 未验」扣分根治）：真实 Chromium required job ----
  # 固定 digest 的 Playwright 官方镜像（含 Python playwright 1.63.0 + 匹配
  # revision 的 Chromium）内真跑 system/tests/browser_e2e.py：
  #   页面加载+四页签真实点击、QUARANTINE/ACCEPTED/OTHER/OPEN 钻取（含零态
  #   可操作）、API/DOM 计数一致、console（pageerror=0；除 logs-403 fail-closed
  #   首询与 meta-CSP 厂商提示外 error=0）、network 全同源（XSS fixture 零外部
  #   请求）、XSS payload 不执行、W11-08 prompt 解锁链；截图/DOM/console/
  #   network/脱敏 HAR 落 /out 工件。
  # 退出码合同：0=全过 / 1=DOM·console·network 不符 / 3=浏览器或运行体不可用
  # （rc3 也必须红——浏览器不可用绝不静默 SKIP）。job 按退出码直接红。
  # 镜像 digest 固定（mcr.microsoft.com/playwright/python:v1.63.0-jammy）：
  #   amd64=sha256:c40a9a29b64f07ba9303d48d232615880de57e9157aa6d9d3c0c5fdb36cdce87
  #   （ubuntu-latest runner=amd64；arm64 本机预验同 tag digest=
  #    sha256:6679b332bf4d772a9bf2bb3d7715f8e35bff5808c9d06e2599c767f828f8e3f1）
  browser-e2e:
    name: browser-e2e   # W11-14 exact required check context 同名
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 真实 Chromium 浏览器验证（固定 digest 容器）
        env:
          WQ_PW_IMAGE: mcr.microsoft.com/playwright/python@sha256:c40a9a29b64f07ba9303d48d232615880de57e9157aa6d9d3c0c5fdb36cdce87
        run: |
          set -euo pipefail
          echo "commit_sha=${GITHUB_SHA} image=${WQ_PW_IMAGE}"
          docker pull "$WQ_PW_IMAGE"
          docker image inspect "$WQ_PW_IMAGE" --format 'pinned-digest={{index .RepoDigests 0}}'
          CTR=wq-browser-e2e
          trap 'docker rm -f "$CTR" >/dev/null 2>&1 || true' EXIT
          mkdir -p /tmp/wq-browser-evidence && chmod 777 /tmp/wq-browser-evidence
          timeout 600 docker run --rm --name "$CTR" \
            --ipc=host \
            -v "${GITHUB_WORKSPACE}:/wq:ro" \
            -v "/tmp/wq-browser-evidence:/out" \
            -e PYTHONDONTWRITEBYTECODE=1 \
            "$WQ_PW_IMAGE" \
            bash -c "python3 -c 'import playwright' 2>/dev/null || pip3 install -q 'playwright==1.63.0' ; python3 /wq/system/tests/browser_e2e.py --out /out/browser"
      - name: 归档浏览器证据（截图/DOM/console/network/脱敏 HAR）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-evidence
          path: /tmp/wq-browser-evidence/
          retention-days: 30
