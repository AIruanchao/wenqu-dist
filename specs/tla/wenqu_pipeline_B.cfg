\* wenqu_pipeline TLC 配置 B —— 2 段 × 2 attempts（retry / CAS / nonce 重放）
\* 规约正本：specs/tla/wenqu_pipeline.tla（常量表与 wenqu_pipeline.py 逐字对应）
\*
\* 规模旋钮：
\*   StageIds = {1,2}   —— 2 段（正典七段的前两段；StageOrder 收全七段）
\*   MaxHistLen = 4     —— 每段历史 ≤ 4 元素 = 2 attempt（RUNNING+终态 × 2）：
\*                          attempt 终态（FAILED/WAITING）后新 attempt 承接
\*                          ——retry 路径；ConsumeResume 后 ahist 追加 RUNNING
\*   MaxVer = 14        —— ver 封顶（与 2026-10-08 基线运行同界，可比对）
\*   r1/r2/k1/k2        —— 审批原子（resume×2 / risk×2），CAS 锚见模块
\*                          ExpectedVerOf（2/5/3/6，覆盖命中与失配两分支）：
\*                          r2@ver5 在「S1 PASSED→S2 停等」处命中（CAS 命中+
\*                          resume retry）；已消费原子再消费被 nonceUsed[n]=0
\*                          守卫拒绝（nonce 重放拒绝路径）
\*
\* 覆盖目标：retry 新 attempt、CAS 命中/失配、nonce 重放拒绝。
\* 预期结果：Model checking completed — No errors（7 不变量全量可达状态恒成立）
CONSTANTS
  StageIds = {1, 2}
  r1 = r1
  r2 = r2
  k1 = k1
  k2 = k2
  MaxHistLen = 4
  MaxVer = 14

SPECIFICATION Spec

INVARIANT
  TypeOK
  NoSkipStages
  PriorPassedGate
  AttemptImmutable
  NonceOnceConsumed
  TerminalFinal
  DoubleAxisNoWash

CONSTRAINT
  Bounded
