\* wenqu_pipeline TLC 配置 A —— 七段全序 × 1 attempt（G9-03 / W1 七段覆盖）
\* 规约正本：specs/tla/wenqu_pipeline.tla（常量表与 wenqu_pipeline.py 逐字对应）
\*
\* 规模旋钮：
\*   StageIds = {1,2,3,4,5,6,7} —— 七段全序（StageOrder S1..S7 全量实例化；
\*                                   PriorPassedGate/NoSkipStages 对每一段非空洞）
\*   MaxHistLen = 2              —— 每段历史 ≤ 2 元素 = 1 attempt（无 retry；
\*                                   retry/CAS/nonce 面由配置 B 承接）
\*   MaxVer = 16                 —— 7 段×(启动+终态化)=14 事件 + ≤1 终态事件
\*   r1/r2/k1/k2                 —— 审批原子；k1@ver3/k2@ver6 在七段推进中
\*                                   可命中（CAS 命中分支）→ COMPLETED_CONDITIONAL
\*                                   终态可达；r 锚在 1 attempt 界下不可命中（失配分支）
\*
\* 覆盖目标：完整段序（S1→S7 逐段启动/终态化）与五类 run 终态
\* （SUCCEEDED / COMPLETED_CONDITIONAL / FAILED / CANCELLED / SUPERSEDED）。
\* 预期结果：Model checking completed — No errors（7 不变量全量可达状态恒成立）
CONSTANTS
  StageIds = {1, 2, 3, 4, 5, 6, 7}
  r1 = r1
  r2 = r2
  k1 = k1
  k2 = k2
  MaxHistLen = 2
  MaxVer = 16

SPECIFICATION Spec

INVARIANT
  TypeOK
  NoSkipStages
  PriorPassedGate
  AttemptImmutable
  NonceOnceConsumed
  TerminalFinal
  DoubleAxisNoWash

CONSTRAINT
  Bounded
