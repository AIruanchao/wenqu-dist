\* wenqu_pipeline TLC 模型配置——小模型：2 段 × 2 attempt 界（任务口径）
\* 规约正本：specs/tla/wenqu_pipeline.tla（常量表与 wenqu_pipeline.py 逐字对应）
\*
\* 规模旋钮：
\*   StageIds = {1,2}   —— 2 段（正典七段的前两段；StageOrder 收全七段）
\*   MaxHistLen = 4     —— 每段历史 ≤ 4 元素 = 2 attempt（RUNNING+终态 × 2）
\*   r1/r2/k1/k2        —— 审批原子（resume×2 / risk×2），CAS 锚见模块
\*                          ExpectedVerOf（2/5/3/6，覆盖命中与失配两分支）
\*   CONSTRAINT Bounded —— ver ≤ 14 截断无限计数（有界模型检查）
\*
\* 预期结果：Model checking completed — No errors（7 不变量在全量可达状态恒成立）
CONSTANTS
  StageIds = {1, 2}
  r1 = r1
  r2 = r2
  k1 = k1
  k2 = k2
  MaxHistLen = 4

SPECIFICATION Spec

INVARIANT
  TypeOK
  NoSkipStages
  PriorPassedGate
  AttemptImmutable
  NonceOnceConsumed
  TerminalFinal
  DoubleAxisNoWash

CONSTRAINT
  Bounded
